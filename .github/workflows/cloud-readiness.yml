name: Controlled maintenance release build
run-name: Combined maintenance release 4b978f341
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-release-20261030
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_SHA: 4b978f341
      NODE_OPTIONS: --max-old-space-size=8192
      CARGO_BUILD_JOBS: 2
      GOMEMLIMIT: 6GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/controlled-maintenance-20261030
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Exact source and build resources
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git rev-parse --short=9 HEAD)" = "$RELEASE_SHA"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          git status --porcelain > evidence/initial-status.txt
          test ! -s evidence/initial-status.txt
          git fetch --depth=1 origin "$GITHUB_WORKFLOW_SHA"
          git show "$GITHUB_WORKFLOW_SHA":.github/qualification/package-maintenance.ts > .github/package-maintenance.ts
          sed -i 's|../../cli/src/commands/install.ts|../cli/src/commands/install.ts|' .github/package-maintenance.ts
          free -b > evidence/memory.txt
          df -B1 . > evidence/disk.txt
          node --version > evidence/node.txt
          pnpm --version > evidence/pnpm.txt
          sha256sum pnpm-lock.yaml > evidence/lock.sha256
      - name: Frozen install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee evidence/install.log
      - name: Complete build
        run: |
          set -o pipefail
          pnpm run preflight:workspace-links
          pnpm -r --workspace-concurrency=1 build 2>&1 | tee evidence/build.log
          echo 0 > evidence/build.exit
      - name: Complete typecheck
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          pnpm -r --workspace-concurrency=1 typecheck 2>&1 | tee evidence/typecheck.log
          echo 0 > evidence/typecheck.exit
      - name: Combined recovery and routing acceptance
        run: |
          set -euo pipefail
          pnpm exec vitest run packages/adapter-utils/src/server-utils.test.ts --reporter=json --outputFile=evidence/recovery-tests.json > evidence/recovery-tests.log 2>&1
          cd server
          ../node_modules/.bin/vitest run src/__tests__/heartbeat-stale-queue-invalidation.test.ts -t 11932 --testTimeout=60000 --reporter=json --outputFile=../evidence/routing-tests.json > ../evidence/routing-tests.log 2>&1
      - name: Build installable payload with native packaging
        run: |
          set -o pipefail
          pnpm exec tsx .github/package-maintenance.ts 2>&1 | tee evidence/packaging.log
          test -z "$(git diff --name-only)"
          git status --porcelain > evidence/final-status.txt
          cd release-output
          sha256sum paperclip-maintenance-linux-x64.tar.gz installed-package-lock.json package-provenance.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maintenance-build-evidence
          path: evidence/
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paperclip-maintenance-linux-x64
          path: |
            release-output/paperclip-maintenance-linux-x64.tar.gz
            release-output/installed-package-lock.json
            release-output/package-provenance.json
            release-output/SHA256SUMS
          retention-days: 30
