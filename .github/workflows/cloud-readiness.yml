name: Frozen recovery qualification
run-name: Frozen recovery qualification 48bb4e1be vs bba6a45f0
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frozen-recovery-qualification-20261029
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: baseline
            sha: bba6a45f0d364cfd962ac59b3bdf2426a8222adb
          - label: candidate
            sha: 48bb4e1bef4b5f032cb5bd75d5958356750ffb8d
    env:
      CI: 'true'
      CARGO_BUILD_JOBS: '2'
      PAPERCLIP_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: VictorGTheCoder/paperclip
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify source identity and clean hosted environment
        id: identity
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          QUALIFICATION_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          git fetch --no-tags --depth=1 origin bba6a45f0d364cfd962ac59b3bdf2426a8222adb 48bb4e1bef4b5f032cb5bd75d5958356750ffb8d
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,socket,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          expected=os.environ['EXPECTED_SHA']; actual=git('rev-parse','HEAD')
          production_paths=['/home/paperclip','/home/bobby/.codex','/home/bobby/.paperclip','/home/bobby/.config/gh','/home/bobby/worktrees']
          sensitive=['PAPERCLIP_API_KEY','PAPERCLIP_CONFIG','DATABASE_URL','OPENAI_API_KEY','ANTHROPIC_API_KEY','CODEX_HOME']
          mem=dict(line.split(':',1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines())
          ram=int(mem['MemTotal'].strip().split()[0])*1024
          sock=socket.socket(); sock.settimeout(2); port_open=sock.connect_ex(('127.0.0.1',3100))==0; sock.close()
          patch=subprocess.check_output(['git','diff','--no-ext-diff','--full-index','--binary','bba6a45f0d364cfd962ac59b3bdf2426a8222adb','48bb4e1bef4b5f032cb5bd75d5958356750ffb8d','--'])
          names=git('diff','--name-only','bba6a45f0d364cfd962ac59b3bdf2426a8222adb','48bb4e1bef4b5f032cb5bd75d5958356750ffb8d').splitlines()
          record={'expectedSha':expected,'actualSha':actual,'tree':git('rev-parse','HEAD^{tree}'),'label':os.environ['QUALIFICATION_LABEL'],'ramBytes':ram,'diskFreeBytes':shutil.disk_usage('.').free,'hostname':socket.gethostname(),'productionPathExists':{x:pathlib.Path(x).exists() for x in production_paths},'sensitiveEnvironmentPresence':{x:x in os.environ for x in sensitive},'localProductionPort3100Open':port_open,'canonicalDiffSha256':hashlib.sha256(patch).hexdigest(),'candidateChangedPaths':names,'workflowRef':os.environ.get('GITHUB_WORKFLOW_REF'),'workflowSha':os.environ.get('GITHUB_WORKFLOW_SHA'),'realACPExecuted':False,'providerCredentialInjected':False,'isolationScope':'Fresh hosted VM and absent production filesystem/credentials; no claim of a qualified real ACP sandbox or unrestricted-network isolation.'}
          pathlib.Path('qualification-evidence/identity.json').write_text(json.dumps(record,indent=2))
          pathlib.Path('qualification-evidence/canonical.patch').write_bytes(patch)
          assert actual==expected
          assert record['canonicalDiffSha256']=='582c3dcd10c77d42c742643d498a6ec3ea2fe3c9cb8dd853a1f445d61ce3ed18'
          assert sorted(names)==sorted(['packages/adapter-utils/src/server-utils.ts','packages/adapter-utils/src/server-utils.test.ts','skills/paperclip/references/api-reference.md'])
          assert ram>=12*1024**3, 'Hosted runner has insufficient RAM'
          assert record['diskFreeBytes']>=10*1024**3, 'Hosted runner has insufficient free disk'
          assert not any(record['productionPathExists'].values())
          assert not any(record['sensitiveEnvironmentPresence'].values())
          assert not port_open
          PY
          node --version > qualification-evidence/node-version.txt
          pnpm --version > qualification-evidence/pnpm-version.txt
          git status --porcelain > qualification-evidence/source-initial-status.txt
      - name: Install exact locked dependencies
        id: install
        continue-on-error: true
        run: |
          set +e
          pnpm install --frozen-lockfile 2>&1 | tee qualification-evidence/install.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > qualification-evidence/install.exit
          exit "$status"
      - name: Full workspace build
        id: build
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          pnpm run preflight:workspace-links 2>&1 | tee qualification-evidence/build-preflight.log
          preflight=${PIPESTATUS[0]}
          if [ "$preflight" -ne 0 ]; then printf '%s\n' "$preflight" > qualification-evidence/build.exit; exit "$preflight"; fi
          timeout --kill-after=10s 5400s pnpm -r --workspace-concurrency=1 build 2>&1 | tee qualification-evidence/build.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > qualification-evidence/build.exit
          exit "$status"
      - name: Full workspace typecheck independently of build result
        id: typecheck
        if: ${{ !cancelled() && steps.identity.outcome == 'success' && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          timeout --kill-after=10s 5400s pnpm -r --workspace-concurrency=1 typecheck 2>&1 | tee qualification-evidence/typecheck.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > qualification-evidence/typecheck.exit
          exit "$status"
      - name: Preserve final source status
        if: always()
        run: |
          mkdir -p qualification-evidence
          git rev-parse HEAD > qualification-evidence/source-final-sha.txt
          git status --porcelain > qualification-evidence/source-final-status.txt
          git diff -- pnpm-lock.yaml > qualification-evidence/lockfile-diff.patch
          free -b > qualification-evidence/memory-final.txt
          df -B1 . > qualification-evidence/disk-final.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frozen-recovery-${{ matrix.label }}-${{ matrix.sha }}
          path: qualification-evidence/
          retention-days: 90
      - name: Qualification result
        if: always()
        env:
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          result={x:os.environ.get(x) for x in ['IDENTITY_OUTCOME','INSTALL_OUTCOME','BUILD_OUTCOME','TYPECHECK_OUTCOME']}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(json.dumps(result,indent=2)+'\n')
          assert all(x=='success' for x in result.values()), result
          assert pathlib.Path('qualification-evidence/lockfile-diff.patch').read_text()==''
          import subprocess
          subprocess.run(['git','diff','--exit-code','HEAD','--'],check=True)
          PY
