name: Controlled maintenance release packaging
run-name: Package verified compiled maintenance release 4b978f341
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: maintenance-release-20261030
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_SHA: 4b978f341
      NODE_OPTIONS: --max-old-space-size=8192
      CARGO_BUILD_JOBS: 2
      GOMEMLIMIT: 6GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/controlled-maintenance-20261030
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify exact release and load packaging harness
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git rev-parse HEAD)" = "4b978f3414a2cb8afa5c8d4fba5b3e1bae98ff90"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch --depth=1 origin "$GITHUB_WORKFLOW_SHA"
          git show "$GITHUB_WORKFLOW_SHA":.github/qualification/package-maintenance.ts > .github/package-maintenance.ts
          sed -i 's|../../cli/src/commands/install.ts|../cli/src/commands/install.ts|' .github/package-maintenance.ts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: maintenance-build-evidence
          path: compiled-evidence
          run-id: 40978599963
          github-token: ${{ github.token }}
      - name: Frozen dependency install and retained compiled output verification
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile > evidence/install.log 2>&1
          test "$(cat compiled-evidence/source-sha.txt)" = "$RELEASE_SHA"
          test "$(cat compiled-evidence/build.exit)" = 0
          test "$(cat compiled-evidence/typecheck.exit)" = 0
          sha256sum compiled-evidence/compiled-workspace.tar.gz > evidence/compiled-workspace.sha256
          tar -xzf compiled-evidence/compiled-workspace.tar.gz
          git diff --exit-code
          python3 - <<'PY'
          import json,pathlib
          for n,count in [('recovery-tests',133),('routing-tests',27)]:
              x=json.loads(pathlib.Path('compiled-evidence',n+'.json').read_text());assert x['numPassedTests']==count and x['numFailedTests']==0
          p={'compiledSourceRun':40978599963,'compiledSourceArtifact':12944377882,'compiledSourceArtifactDigest':'sha256:88c0f2abc630a61f5ccce92d7d1c20d558733425c25bf9297d420674dd42a865','source':'4b978f3414a2cb8afa5c8d4fba5b3e1bae98ff90','fullBuildPassed':True,'fullTypecheckPassed':True,'recoveryPassed':133,'routingPassed':27}
          pathlib.Path('evidence/compiled-source-provenance.json').write_text(json.dumps(p,indent=2))
          PY
      - name: Build installable payload with native packaging
        run: |
          set -o pipefail
          node cli/node_modules/tsx/dist/cli.mjs .github/package-maintenance.ts 2>&1 | tee evidence/packaging.log
          git diff > evidence/post-pack-source.diff
          test -z "$(git diff --name-only)"
          git status --porcelain > evidence/final-status.txt
          cd release-output
          sha256sum paperclip-maintenance-linux-x64.tar.gz installed-package-lock.json package-provenance.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maintenance-packaging-evidence
          path: evidence/
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: paperclip-maintenance-linux-x64
          path: |
            release-output/paperclip-maintenance-linux-x64.tar.gz
            release-output/installed-package-lock.json
            release-output/package-provenance.json
            release-output/SHA256SUMS
          retention-days: 30
