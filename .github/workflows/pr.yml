name: PR

on:
  pull_request:
    # Preserve all original events and also run full CI when a reviewed draft
    # is promoted. This is not a manual pass or a reduction in test coverage.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Repair-branch CI must execute the complete workflow of the installed
    # release, not mutable upstream master or an unavailable historical call.
    # The unmodified local full workflow has a pinned SHA-256 verified by tests;
    # no jobs, permissions or required aggregate checks are removed.
    uses: ./.github/workflows/pr-trusted.yml
